name: Rocam
options:
  bundleIdPrefix: com.rocam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Rocam:
    type: application
    platform: iOS
    sources:
      - path: Rocam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rocam.camera
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Rocam/Info.plist
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
